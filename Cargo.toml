[package]
name = "quantdock"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "web_screen_reader"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml_edit = { version = "0.25.19", features = ["serde"] }
ureq = { version = "3.5.2", features = ["json"] }
windows = { version = "0.62.2", features = ["Win32_Graphics_Gdi", "Win32_Foundation", "Win32_UI_HiDpi"] }
