[package]
name = "quantdock"
version = "0.2.2"
edition = "2024"
autobins = false

[[bin]]
name = "quantdock"
path = "src/bin/quantdock.rs"

[[bin]]
name = "monitor"
path = "src/bin/monitor.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "web_screen_reader"] }
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sysinfo = "0.40.3"
toml_edit = { version = "0.25.19", features = ["serde"] }
tray-icon = { version = "0.26.1", default-features = false }
ureq = { version = "3.5.2", features = ["json"] }
windows = { version = "0.62.2", features = ["Win32_Graphics_Gdi", "Win32_Foundation", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
