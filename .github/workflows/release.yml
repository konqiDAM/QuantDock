name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check tag matches package version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") {
            Write-Error "Release tag '$tag' does not match package version 'v$version'."
            exit 1
          }

      - name: Test
        shell: pwsh
        run: cargo test --all-targets

      - name: Test swap gate
        shell: pwsh
        run: |
          $out = cargo test --all-targets script -- --ignored 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) { exit $code }
          if ($out -notmatch 'test result: ok\. 3 passed') {
            Write-Error "Swap gate did not run the three ignored swap tests."
            exit 1
          }

      - name: Build
        run: cargo build --release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          target/release/quantdock.exe
          target/release/monitor.exe
          --title "QuantDock ${{ github.ref_name }}"
          --generate-notes
